<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <!-- Phone Body -->
  <rect width="360" height="740" rx="40" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="6" />
  <rect x="5" y="5" width="350" height="730" rx="35" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />

  <!-- Dynamic Island -->
  <rect x="120" y="20" width="120" height="30" rx="15" fill="#030712" />

  <!-- UI Header -->
  <g transform="translate(0, 70)">
    <text x="30" y="30" fill="#F9FAFB" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" letter-spacing="-1">Assistente</text>
    <text x="30" y="48" fill="#86868B" font-family="'Geist Sans', sans-serif" font-size="12" font-weight="400">Identifique espécies sem gravar áudios</text>
  </g>

  <!-- Wizard Card -->
  <g transform="translate(24, 150)">
    <rect width="312" height="430" rx="20" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    
    <!-- Progress bar -->
    <text x="24" y="36" fill="#34C759" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="1">PASSO 1 DE 3</text>
    <rect x="24" y="48" width="264" height="6" rx="3" fill="#030712" />
    <rect x="24" y="48" width="88" height="6" rx="3" fill="#34C759" />

    <!-- Question Title -->
    <text x="24" y="85" fill="#F9FAFB" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700">1. Onde você ouviu o som?</text>

    <!-- Option Buttons -->
    <!-- Option 1 -->
    <g transform="translate(24, 110)">
      <rect width="264" height="54" rx="12" fill="#030712" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="31" fill="#F9FAFB" font-family="'Geist Sans', sans-serif" font-size="12" font-weight="500">Áreas Urbanas, Quintais ou Brejos</text>
      <text x="248" y="32" fill="#86868B" font-size="18" text-anchor="end">›</text>
    </g>

    <!-- Option 2 -->
    <g transform="translate(24, 176)">
      <rect width="264" height="54" rx="12" fill="#030712" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="31" fill="#F9FAFB" font-family="'Geist Sans', sans-serif" font-size="12" font-weight="500">Florestas densas ou em Bromélias</text>
      <text x="248" y="32" fill="#86868B" font-size="18" text-anchor="end">›</text>
    </g>

    <!-- Option 3 -->
    <g transform="translate(24, 242)">
      <rect width="264" height="54" rx="12" fill="#030712" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="31" fill="#F9FAFB" font-family="'Geist Sans', sans-serif" font-size="12" font-weight="500">Margem de Lagoas ou Pastagens</text>
      <text x="248" y="32" fill="#86868B" font-size="18" text-anchor="end">›</text>
    </g>

    <!-- Option 4 -->
    <g transform="translate(24, 308)">
      <rect width="264" height="54" rx="12" fill="#030712" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="31" fill="#F9FAFB" font-family="'Geist Sans', sans-serif" font-size="12" font-weight="500">No chão da floresta (folhas caídas)</text>
      <text x="248" y="32" fill="#86868B" font-size="18" text-anchor="end">›</text>
    </g>

    <!-- Skip / Help Text -->
    <text x="156" y="398" fill="#86868B" font-family="'Geist Sans', sans-serif" font-size="12" font-weight="500" text-anchor="middle">Prefiro usar gravação de áudio</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(24, 650)">
    <rect width="312" height="60" rx="30" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="39" y="38" fill="#86868B" font-size="20" text-anchor="middle">📊</text>
    <text x="117" y="38" fill="#86868B" font-size="20" text-anchor="middle">🎙️</text>
    <text x="195" y="38" fill="#86868B" font-size="20" text-anchor="middle">🔍</text>
    <text x="273" y="38" fill="#86868B" font-size="20" text-anchor="middle">🐸</text>
    <!-- Highlight dashboard/wizard tab as active (we can map active to wizard or another tab, let's keep wizard active or use a wizard icon) -->
    <!-- Let's replace explore active with a wizard active, or keep wizard as 🧙 active under active tab index 2 or 3 -->
    <text x="117" y="38" fill="#34C759" font-size="24" text-anchor="middle" filter="url(#glowGreen)">🧙</text>
    <!-- Indicator dot under active -->
    <circle cx="117" cy="48" r="3" fill="#34C759" />
  </g>
</svg>
