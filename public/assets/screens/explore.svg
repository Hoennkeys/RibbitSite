<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <!-- Phone Body -->
  <rect width="360" height="740" rx="40" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="6" />
  <rect x="5" y="5" width="350" height="730" rx="35" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />

  <!-- Dynamic Island -->
  <rect x="120" y="20" width="120" height="30" rx="15" fill="#030712" />

  <!-- UI Header -->
  <g transform="translate(0, 70)">
    <text x="30" y="30" fill="#F9FAFB" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" letter-spacing="-1">Explorar</text>
    <text x="30" y="48" fill="#86868B" font-family="'Geist Sans', sans-serif" font-size="12" font-weight="400">Descubra os anfíbios que habitam o Brasil</text>
  </g>

  <!-- Search Bar -->
  <g transform="translate(24, 140)">
    <rect width="312" height="40" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="12" y="25" fill="#86868B" font-size="14">🔍</text>
    <text x="38" y="24" fill="#86868B" font-family="'Geist Sans', sans-serif" font-size="13" font-weight="400">Buscar por nome ou espécie...</text>
  </g>

  <!-- Region Horizontal List -->
  <g transform="translate(24, 195)">
    <!-- Item 1 (Active) -->
    <rect x="0" y="0" width="80" height="28" rx="14" fill="#34C759" />
    <text x="40" y="18" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Brasil</text>

    <!-- Item 2 -->
    <rect x="88" y="0" width="105" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="140.5" y="17" fill="#86868B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Mata Atlântica</text>

    <!-- Item 3 -->
    <rect x="201" y="0" width="111" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="256.5" y="17" fill="#86868B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Cerrado/Caatinga</text>
  </g>

  <!-- Species List -->
  <g transform="translate(24, 245)">
    <!-- Species 1 -->
    <g transform="translate(0, 0)">
      <rect width="312" height="110" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="32" fill="#F9FAFB" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Sapo-cururu</text>
      <text x="16" y="48" fill="#86868B" font-family="'Geist Sans', sans-serif" font-size="12" font-weight="500" font-style="italic">Rhinella diptycha</text>
      <text x="16" y="70" fill="#86868B" font-family="'Geist Sans', sans-serif" font-size="11" font-weight="400">Grande anfíbio terrestre com pele rugosa...</text>
      <rect x="16" y="80" width="110" height="18" rx="4" fill="#34C759" fill-opacity="0.1" />
      <text x="71" y="92" fill="#34C759" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Cerrado e Caatinga</text>
      <text x="300" y="36" fill="#86868B" font-size="18" text-anchor="end">›</text>
    </g>

    <!-- Species 2 -->
    <g transform="translate(0, 126)">
      <rect width="312" height="110" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="32" fill="#F9FAFB" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Perereca-verde</text>
      <text x="16" y="48" fill="#86868B" font-family="'Geist Sans', sans-serif" font-size="12" font-weight="500" font-style="italic">Aplastodiscus argyreornatus</text>
      <text x="16" y="70" fill="#86868B" font-family="'Geist Sans', sans-serif" font-size="11" font-weight="400">Pequena perereca adaptada para a vida...</text>
      <rect x="16" y="80" width="95" height="18" rx="4" fill="#34C759" fill-opacity="0.1" />
      <text x="63.5" y="92" fill="#34C759" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Mata Atlântica</text>
      <text x="300" y="36" fill="#86868B" font-size="18" text-anchor="end">›</text>
    </g>

    <!-- Species 3 -->
    <g transform="translate(0, 252)">
      <rect width="312" height="110" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1" opacity="0.6" />
      <text x="16" y="32" fill="#F9FAFB" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Rã-pimenta</text>
      <text x="16" y="48" fill="#86868B" font-family="'Geist Sans', sans-serif" font-size="12" font-weight="500" font-style="italic">Leptodactylus labyrinthicus</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(24, 650)">
    <rect width="312" height="60" rx="30" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="39" y="38" fill="#86868B" font-size="20" text-anchor="middle">📊</text>
    <text x="117" y="38" fill="#86868B" font-size="20" text-anchor="middle">🎙️</text>
    <text x="195" y="38" fill="#86868B" font-size="20" text-anchor="middle">🔍</text>
    <text x="273" y="38" fill="#86868B" font-size="20" text-anchor="middle">🐸</text>
    <!-- Highlight search tab as active -->
    <text x="195" y="38" fill="#34C759" font-size="24" text-anchor="middle" filter="url(#glowGreen)">🔍</text>
    <!-- Indicator dot under active -->
    <circle cx="195" cy="48" r="3" fill="#34C759" />
  </g>
</svg>
