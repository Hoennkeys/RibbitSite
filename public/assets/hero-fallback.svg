<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <!-- Definitions of gradients and blurs -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0c111d" />
    </linearGradient>
    
    <!-- Primary Green-Blue Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34C759" />
      <stop offset="100%" stop-color="#0071E3" />
    </linearGradient>

    <!-- Glassmorphism Card Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glowing Blurs -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur" />
    </filter>
    <filter id="glassBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Ambient Glow Layers -->
  <circle cx="950" cy="300" r="180" fill="#34C759" opacity="0.12" filter="url(#glowGreen)" />
  <circle cx="350" cy="500" r="220" fill="#8B5CF6" opacity="0.08" filter="url(#glowPurple)" />

  <!-- Vector Grid Lines -->
  <g opacity="0.03" stroke="#f9fafb" stroke-width="1">
    <!-- Horizontal lines -->
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <!-- Vertical lines -->
    <line x1="150" y1="0" x2="150" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="450" y1="0" x2="450" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="750" y1="0" x2="750" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1050" y1="0" x2="1050" y2="675" />
  </g>

  <!-- HERO LEFT SIDE (TEXT CONTENT) -->
  <g transform="translate(100, 180)">
    <!-- Brand Tag -->
    <rect width="130" height="28" rx="14" fill="url(#primaryGrad)" opacity="0.15" />
    <text x="12" y="18" fill="#34C759" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">CIÊNCIA CIDADÃ</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#F9FAFB" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" letter-spacing="-2">A voz dos anfíbios</text>
    <text x="0" y="145" fill="url(#primaryGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" letter-spacing="-2">revelada pela ciência</text>

    <!-- Subtitle -->
    <text x="0" y="200" fill="#86868B" font-family="'Geist Sans', sans-serif" font-size="16" font-weight="400" width="500">
      Grave coaxares de anfíbios, processe espectrogramas e faça parte do
    </text>
    <text x="0" y="222" fill="#86868B" font-family="'Geist Sans', sans-serif" font-size="16" font-weight="400" width="500">
      maior banco de dados bioacústicos de herpetologia do Brasil.
    </text>

    <!-- CTAs -->
    <!-- Primary CTA -->
    <g transform="translate(0, 270)">
      <rect width="180" height="50" rx="12" fill="#34C759" />
      <text x="90" y="30" fill="#F9FAFB" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Baixar Grátis</text>
    </g>

    <!-- Secondary CTA -->
    <g transform="translate(200, 270)">
      <rect width="180" height="50" rx="12" fill="none" stroke="#1E293B" stroke-width="1.5" />
      <text x="90" y="30" fill="#F9FAFB" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Como Funciona</text>
    </g>
  </g>

  <!-- HERO RIGHT SIDE (PHONE MOCKUP & SPECTROGRAM) -->
  <g transform="translate(750, 100)">
    <!-- Spectrogram Wave Backdrop -->
    <path d="M-150,280 C-100,180 -50,380 0,280 C50,180 100,320 150,280 C200,240 250,320 300,280" fill="none" stroke="#34C759" stroke-width="3" stroke-linecap="round" opacity="0.3" filter="url(#glowGreen)" />
    <path d="M-150,280 C-100,220 -50,320 0,280 C50,240 100,360 150,280 C200,200 250,350 300,280" fill="none" stroke="#0071E3" stroke-width="2" stroke-linecap="round" opacity="0.5" />

    <!-- Phone Glass Body (Outer Casing) -->
    <rect x="-120" y="0" width="240" height="480" rx="40" fill="#030712" stroke="#1E293B" stroke-width="3" />
    <rect x="-115" y="5" width="230" height="470" rx="35" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

    <!-- Phone Screen (Frosted glass styling) -->
    <rect x="-112" y="8" width="224" height="464" rx="32" fill="url(#glassGrad)" />

    <!-- Dynamic Island / Top Notch -->
    <rect x="-45" y="20" width="90" height="24" rx="12" fill="#030712" />

    <!-- App UI Mockup Elements inside phone -->
    <!-- App Header Logo inside phone -->
    <text x="0" y="75" fill="#34C759" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" text-anchor="middle">🐸</text>
    
    <!-- Sound ID UI Box inside phone -->
    <g transform="translate(-90, 110)">
      <rect width="180" height="150" rx="16" fill="#0f172a" fill-opacity="0.6" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="28" fill="#F9FAFB" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Sound ID</text>
      <text x="16" y="46" fill="#86868B" font-family="'Geist Sans', sans-serif" font-size="10" font-weight="400">Gravando coaxar...</text>
      
      <!-- Waveform inside phone -->
      <g transform="translate(16, 75)" fill="#34C759" opacity="0.8">
        <rect x="0" y="-10" width="4" height="20" rx="2" />
        <rect x="8" y="-18" width="4" height="36" rx="2" />
        <rect x="16" y="-28" width="4" height="56" rx="2" />
        <rect x="24" y="-35" width="4" height="70" rx="2" />
        <rect x="32" y="-45" width="4" height="90" rx="2" fill="#0071E3" />
        <rect x="40" y="-30" width="4" height="60" rx="2" fill="#0071E3" />
        <rect x="48" y="-40" width="4" height="80" rx="2" />
        <rect x="56" y="-22" width="4" height="44" rx="2" />
        <rect x="64" y="-12" width="4" height="24" rx="2" />
        <rect x="72" y="-18" width="4" height="36" rx="2" />
        <rect x="80" y="-30" width="4" height="60" rx="2" fill="#0071E3" />
        <rect x="88" y="-20" width="4" height="40" rx="2" />
        <rect x="96" y="-15" width="4" height="30" rx="2" />
        <rect x="104" y="-25" width="4" height="50" rx="2" />
        <rect x="112" y="-10" width="4" height="20" rx="2" />
        <rect x="120" y="-5" width="4" height="10" rx="2" />
      </g>
      <text x="90" y="136" fill="#34C759" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">00:04</text>
    </g>

    <!-- Bottom Navigation Bar inside phone -->
    <g transform="translate(-90, 400)">
      <rect width="180" height="45" rx="22" fill="#0F172A" fill-opacity="0.8" stroke="#1E293B" stroke-width="1" />
      <!-- Navigation Tabs (Emojis as simple placeholders) -->
      <text x="25" y="28" fill="#F9FAFB" font-size="16" text-anchor="middle">📊</text>
      <text x="65" y="28" fill="#34C759" font-size="20" text-anchor="middle" filter="url(#glowGreen)">🎙️</text>
      <text x="115" y="28" fill="#F9FAFB" font-size="16" text-anchor="middle">🔍</text>
      <text x="155" y="28" fill="#F9FAFB" font-size="16" text-anchor="middle">🐸</text>
    </g>

    <!-- Floating Species Card (Overlap effect) -->
    <g transform="translate(30, 240)">
      <rect width="150" height="110" rx="16" fill="#0F172A" fill-opacity="0.95" stroke="#34C759" stroke-opacity="0.4" stroke-width="1.5" />
      <!-- Match percentage badge -->
      <rect x="12" y="12" width="48" height="18" rx="9" fill="#34C759" fill-opacity="0.15" />
      <text x="36" y="25" fill="#34C759" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle">96% Match</text>
      
      <text x="12" y="52" fill="#F9FAFB" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Sapo-cururu</text>
      <text x="12" y="68" fill="#86868B" font-family="'Geist Sans', sans-serif" font-size="10" font-weight="500" font-style="italic">Rhinella diptycha</text>
      
      <!-- Tiny Play Button -->
      <circle cx="125" cy="80" r="14" fill="#34C759" />
      <polygon points="122,74 131,80 122,86" fill="#F9FAFB" />
    </g>
  </g>
</svg>
